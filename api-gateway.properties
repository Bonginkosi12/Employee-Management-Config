server.port=8085

# Eureka Client
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# Employee Service
spring.cloud.gateway.server.webmvc.routes[0].id=employee-service
spring.cloud.gateway.server.webmvc.routes[0].uri=lb://EMPLOYEE-SERVICE
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/api/employees/**
spring.cloud.gateway.server.webmvc.routes[0].filters[0]=RewritePath=/api/employees(?<remaining>/?.*),/users${remaining}

# Leave Service
spring.cloud.gateway.server.webmvc.routes[1].id=leave-service
spring.cloud.gateway.server.webmvc.routes[1].uri=lb://LEAVE-SERVICE
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/api/leaves/**
spring.cloud.gateway.server.webmvc.routes[1].filters[0]=RewritePath=/api/leaves(?<remaining>/?.*),/employee_leave${remaining}

# Performance Service
spring.cloud.gateway.server.webmvc.routes[2].id=perfomance-service
spring.cloud.gateway.server.webmvc.routes[2].uri=lb://PERFOMANCE-SERVICE
spring.cloud.gateway.server.webmvc.routes[2].predicates[0]=Path=/api/perfomance/**

# Attendance Service
spring.cloud.gateway.server.webmvc.routes[3].id=attendance-service
spring.cloud.gateway.server.webmvc.routes[3].uri=lb://ATTENDANCE-SERVICE
spring.cloud.gateway.server.webmvc.routes[3].predicates[0]=Path=/api/attendance/**

# Salary Service
spring.cloud.gateway.server.webmvc.routes[4].id=salary-service
spring.cloud.gateway.server.webmvc.routes[4].uri=lb://SALARY-SERVICE
spring.cloud.gateway.server.webmvc.routes[4].predicates[0]=Path=/api/salaries/**

