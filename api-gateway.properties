spring.cloud.gateway.server.webmvc.routes[2].predicates[0]=Path=/api/attendance/**

spring.cloud.gateway.server.webmvc.routes[3].id=attendance-service
spring.cloud.gateway.server.webmvc.routes[3].uri=http://localhost:8083
spring.cloud.gateway.server.webmvc.routes[3].predicates[0]=Path=/api/attendance/**

